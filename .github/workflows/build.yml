name: Build OpenWrt BPi-R4 (SFP Fan)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Clone OpenWrt Source
      run: |
        git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Target (BPi-R4)
      working-directory: ./openwrt
      run: |
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-fan=y" >> .config
        make defconfig

    - name: Create Proper SFP Fan Patch
      working-directory: ./openwrt
      run: |
        # Создаем папку для патчей (версия ядра может меняться, поэтому wildcard для safety)
        # В текущем snapshot ядро 6.12, но patch utility найдет путь сама, если положить в generic
        mkdir -p target/linux/mediatek/patches-6.12
        
        # Генерируем патч, который ищет конец gmac1 и добавляет наш блок ПОСЛЕ него.
        # Используем cat с экранированием EOF, чтобы переменные не раскрывались.
        cat << 'EOF' > target/linux/mediatek/patches-6.12/999-bpi-r4-sfp-fan.patch
        --- a/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts
        +++ b/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts
        @@ -74,4 +74,23 @@
         	openwrt,netdev-name = "sfp-lan";
         	status = "okay";
         };
        +
        +&pio {
        +	pwm6_pins: pwm6-pins {
        +		mux {
        +			function = "pwm";
        +			groups = "pwm6_0";
        +		};
        +	};
        +};
        +
        +/ {
        +	sfp_fan: sfp-fan {
        +		compatible = "pwm-fan";
        +		pwms = <&pwm 6 50000>;
        +		pinctrl-names = "default";
        +		pinctrl-0 = <&pwm6_pins>;
        +		cooling-levels = <0 100 255>;
        +		#cooling-cells = <2>;
        +	};
        +};
        EOF
        
        # Проверка: выводим содержимое патча в лог
        cat target/linux/mediatek/patches-6.12/999-bpi-r4-sfp-fan.patch

    - name: Download Sources
      working-directory: ./openwrt
      run: make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Firmware
        path: |
          openwrt/bin/targets/mediatek/filogic/*sdcard.img.gz
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb