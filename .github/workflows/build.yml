name: Build OpenWrt BPi-R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (25.12-rc3)
        run: |
          git clone --depth 1 -b v25.12.0-rc3 https://github.com/openwrt/openwrt.git openwrt

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Custom Patches
        run: |
          mkdir -p openwrt/target/linux/mediatek/patches-6.12
          cp patches/*.patch openwrt/target/linux/mediatek/patches-6.12/
          echo "Patches applied."

      - name: Generate Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
          # Добавляем Luci, чтобы не настраивать всё через SSH
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          make defconfig

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-25.12-rc3-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.itb
