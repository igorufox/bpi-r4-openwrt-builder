name: Build OpenWrt BPi-R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (25.12-rc3)
        run: |
          git clone --depth 1 -b v25.12.0-rc3 https://github.com/openwrt/openwrt.git openwrt

      - name: Cache Toolchain & DL
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ${{ runner.os }}-openwrt-v25-12

      - name: Update Feeds
        run: |
          cd openwrt
          # Переключаемся на зеркала и выкидываем битый фид video
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i '/video/d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Hardcoded Fixes
        run: |
          cd openwrt
          
          # 1. Прямая правка DTS для вентилятора (PWM6)
          # В 25.12-rc3 файл лежит в files-6.12
          DTS="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts"
          if [ -f "$DTS" ]; then
            echo "Modifying DTS for Fan PWM6..."
            echo -e "\n&pio {\n\tpwm6_pins: pwm6-pins {\n\t\tmux {\n\t\t\tfunction = \"pwm\";\n\t\t\tgroups = \"pwm6\";\n\t\t};\n\t};\n};\n\n&pwm {\n\tpinctrl-0 = <&pwm0_pins>, <&pwm6_pins>;\n\tstatus = \"okay\";\n};" >> "$DTS"
          else
            echo "ERROR: DTS file NOT FOUND at $DTS"
            exit 1
          fi

          # 2. Создание патча для SFP ODI (с исправленным путем a/ и b/)
          mkdir -p target/linux/mediatek/patches-6.12
          cat << 'EOF' > target/linux/mediatek/patches-6.12/999-sfp-odi-quirk.patch
--- a/drivers/net/phy/sfp-quirks.c
+++ b/drivers/net/phy/sfp-quirks.c
@@ -401,6 +401,7 @@ static const struct sfp_quirk sfp_quirks[] = {
 	SFP_QUIRK_F("HUAWEI", "MA5671A", sfp_quirk_2500base_x),
 	SFP_QUIRK_F("ODI", "DFP-34X-2C2", sfp_quirk_2500base_x),
+	SFP_QUIRK_F("ODI", "DFP-34X-2C3", sfp_quirk_2500base_x),
 	SFP_QUIRK_M("SFP-GE-T", sfp_quirk_1000base_t),
 EOF
          echo "SFP Patch created successfully."

      - name: Generate Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-acme=y" >> .config
          echo "CONFIG_PACKAGE_nginx-ssl=y" >> .config
          make defconfig

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-Custom-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.itb