name: Fast Combo Build (SDK + ImageBuilder)

on:
  workflow_dispatch:

env:
  # Версия OpenWrt и цель
  RELEASE: 25.12.0-rc4
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: bananapi_bpi-r4
  # Ссылка на папку загрузок (файлы найдем сами)
  BASE_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    # --- ЭТАП 1: ПОЛУЧЕНИЕ ЗОЛОТОГО DTB ЧЕРЕЗ SDK ---
    - name: Download & Setup SDK (Auto-Detect)
      run: |
        # 1. Скачиваем контрольную сумму, чтобы узнать точное имя файла SDK
        echo "🔎 Searching for SDK in ${{ env.BASE_URL }}..."
        wget "${{ env.BASE_URL }}/sha256sums" -O sha256sums
        
        # 2. Ищем имя файла SDK (обычно содержит 'openwrt-sdk' и заканчивается на '.tar.zst')
        SDK_FILE=$(grep -o "openwrt-sdk-.*\.tar\.zst" sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "❌ ERROR: Could not find SDK filename in sha256sums!"
          cat sha256sums
          exit 1
        fi
        
        echo "✅ Found SDK: $SDK_FILE"
        
        # 3. Скачиваем сам SDK
        wget "${{ env.BASE_URL }}/$SDK_FILE" -O sdk.tar.zst
        
        # 4. Распаковываем
        tar --zstd -xvf sdk.tar.zst
        mv openwrt-sdk-* sdk

    - name: Prepare SDK
      working-directory: ./sdk
      run: |
        # Обновляем списки пакетов (нужно для ядра)
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Создаем конфиг под R4
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        EOF
        make defconfig

    - name: Unpack Kernel Source
      working-directory: ./sdk
      run: |
        # Скачиваем и распаковываем исходники ядра (но не компилируем пока)
        make target/linux/prepare

    - name: 🔥 APPLY FAN PATCH (To Source)
      working-directory: ./sdk
      run: |
        # Ищем распакованный файл DTS
        DTS_FILE=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" | head -n 1)
        
        if [ -z "$DTS_FILE" ]; then
          echo "❌ ERROR: DTS file not found after unpack!"
          exit 1
        fi

        echo "✅ Patcher: Found DTS at $DTS_FILE"
        
        # Дописываем настройки вентилятора в конец файла
        cat << 'EOF' >> "$DTS_FILE"

        /* --- USER FAN PATCH (FROM SOURCE) --- */
        &pwm {
            status = "okay";
        };

        &pio {
            pwm6_pins: pwm6-pins {
                mux {
                    function = "pwm";
                    groups = "pwm6_0";
                };
            };
        };

        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 7