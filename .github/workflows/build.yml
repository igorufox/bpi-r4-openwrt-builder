name: Build OpenWrt BPi-R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (25.12-rc3)
        run: |
          git clone --depth 1 -b v25.12.0-rc3 https://github.com/openwrt/openwrt.git openwrt

      - name: Cache Toolchain & DL
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ${{ runner.os }}-openwrt-v25-12

      - name: Update Feeds
        run: |
          cd openwrt
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i '/video/d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-acme=y" >> .config
          echo "CONFIG_PACKAGE_nginx-ssl=y" >> .config
          make defconfig

      - name: Unpack and Fix Kernel (Final)
        run: |
          cd openwrt
          
          # 1. Распаковка ядра.
          # Это создаст папки с исходниками в build_dir
          echo "Unpacking kernel sources..."
          make target/linux/prepare V=s
          
          # 2. Переходим в папку с ядром 6.12
          # Используем wildcard (*), так как точная версия может меняться (напр. 6.12.10 -> 6.12.11)
          cd build_dir/target-*/linux-*/linux-6.12*
          echo "Working directory: $(pwd)"
          
          # 3. ПРАВКА SFP (ODI)
          # Файл: drivers/net/phy/sfp.c (в 6.12 код переехал сюда)
          # Логика: Вставляем в начало массива sfp_quirks, чтобы не ломать структуру
          # Синтаксис: SFP_QUIRK(vendor, part, mode, fixup) - ровно 4 аргумента
          echo "Patching SFP..."
          if [ -f "drivers/net/phy/sfp.c" ]; then
            sed -i '/sfp_quirks\[\] = {/a \	SFP_QUIRK("ODI", "DFP-34X-2C3", sfp_quirk_2500basex, NULL),' drivers/net/phy/sfp.c
            grep "DFP-34X-2C3" drivers/net/phy/sfp.c && echo "SFP Patch OK"
          else
            echo "FATAL: sfp.c not found"
            exit 1
          fi
          
          # 4. ПРАВКА DTS (PWM Fan)
          # Файл: arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts
          # Проблема: Ядро 6.12 не содержит описания pwm0_pins, поэтому ссылка на него вызывает ошибку.
          # Решение: Мы вручную описываем и pwm0 (сток), и pwm6 (твой мод).
          echo "Patching DTS..."
          if [ -f "arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts" ]; then
            cat << 'EOF_DTS' >> arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts

          /* Добавляем описание пинов в контроллер PIO */
          &pio {
              /* Описываем PWM0 (Вентилятор ЦПУ), которого не хватало в стоке */
              pwm0_pins: pwm0-pins {
                  mux {
                      function = "pwm";
                      groups = "pwm0";
                  };
              };

              /* Описываем PWM6 (Вентилятор корпуса/доп) */
              pwm6_pins: pwm6-pins {
                  mux {
                      function = "pwm";
                      groups = "pwm6";
                  };
              };
          };

          /* Включаем PWM и ссылаемся на описанные выше пины */
          &pwm {
              pinctrl-names = "default";
              pinctrl-0 = <&pwm0_pins>, <&pwm6_pins>;
              status = "okay";
          };
          EOF_DTS
            echo "DTS Patch OK"
          else
            echo "FATAL: DTS file not found"
            exit 1
          fi

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-Custom-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.itb