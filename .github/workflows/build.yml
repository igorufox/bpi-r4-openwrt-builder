name: SDK Build (No Compilation Errors)

on:
  workflow_dispatch:

env:
  # Основные настройки
  RELEASE: 25.12.0-rc4
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: bananapi_bpi-r4
  # Базовая ссылка, где лежат файлы (без имен конкретных файлов)
  BASE_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        # Набор нужен минимальный, так как компилятор у нас уже будет свой (из SDK)
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    # === ШАГ 1: СКАЧИВАЕМ SDK (Умный поиск) ===
    - name: Download & Setup SDK
      run: |
        # 1. Качаем список файлов сервера
        wget -q "${{ env.BASE_URL }}/sha256sums" -O sha256sums
        
        # 2. Ищем файл, в имени которого есть 'sdk' и который заканчивается на 'tar.zst'
        SDK_FILE=$(grep -o "openwrt-sdk-.*\.tar\.zst" sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "❌ ERROR: SDK file not found in sha256sums!"
          cat sha256sums
          exit 1
        fi
        
        echo "✅ Found SDK: $SDK_FILE"
        
        # 3. Качаем именно его
        wget "${{ env.BASE_URL }}/$SDK_FILE" -O sdk.tar.zst
        
        # 4. Распаковываем
        tar --zstd -xvf sdk.tar.zst
        mv openwrt-sdk-* sdk

    # === ШАГ 2: ПОДГОТОВКА ЯДРА ===
    - name: Prepare Kernel Source
      working-directory: ./sdk
      run: |
        # Обновляем фиды (SDK требует это для работы make menuconfig, даже если мы не выбираем пакеты)
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Создаем конфиг
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        EOF
        make defconfig
        
        # Распаковываем исходники ядра (Download + Unpack)
        # Это скачает linux-6.12.x.tar.xz и распакует в build_dir/...
        make target/linux/prepare

    # === ШАГ 3: ПАТЧИМ DTS ===
    - name: 🔥 APPLY FAN PATCH
      working-directory: ./sdk
      run: |
        # Ищем, куда распаковался DTS файл
        DTS_FILE=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" | head -n 1)
        
        if [ -z "$DTS_FILE" ]; then
           echo "❌ ERROR: DTS file not found inside SDK!"
           exit 1
        fi

        echo "✅ Patching $DTS_FILE ..."
        
        # Вживляем патч
        cat << 'EOF' >> "$DTS_FILE"

        /* --- USER FAN PATCH (SDK METHOD) --- */
        &pwm { status = "okay"; };
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    # === ШАГ 4: КОМПИЛЯЦИЯ DTB ===
    - name: Compile DTB
      working-directory: ./sdk
      run: |
        # Запускаем компиляцию ядра. 
        # Так как это SDK, он использует ВСТРОЕННЫЙ компилятор, ошибок elfutils не будет!
        make target/linux/compile -j$(nproc)

    - name: Extract Golden DTB
      working-directory: ./sdk
      run: |
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        
        if [ -z "$DTB" ]; then
           echo "❌ ERROR: DTB binary not found!"
           exit 1
        fi
        
        cp "$DTB" ../golden_patched.dtb
        echo "✅ FOUND: ../golden_patched.dtb"

    # === ШАГ 5: IMAGE BUILDER ===
    - name: Download ImageBuilder (Auto-Detect)
      run: |
        IB_FILE=$(grep -o "openwrt-imagebuilder-.*\.tar\.zst" sha256sums | head -n 1)
        echo "✅ Found ImageBuilder: $IB_FILE"
        wget "${{ env.BASE_URL }}/$IB_FILE" -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Build Final Firmware
      working-directory: ./imagebuilder
      run: |
        # Прогрев
        make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true
        
        # Подмена файла
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        if [ -z "$TARGET_DTB" ]; then
           make target/linux/prepare || true
           TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi
        
        echo "🔄 Replacing $TARGET_DTB with our Golden DTB"
        cp ../golden_patched.dtb "$TARGET_DTB"
        
        # Сборка
        make image PROFILE="${{ env.PROFILE }}" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Silent-Firmware
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz