name: Build BPi-R4 Thermal Mod Firmware

on:
  workflow_dispatch: # Позволяет запускать сборку вручную по кнопке на GitHub

jobs:
  build:
    runs-on: ubuntu-latest # Сервер GitHub берет на себя всю компиляцию

    steps:
      - name: 1. Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip zstd

      - name: 2. Скачивание OpenWrt (25.12.1) и базовая настройка
        run: |
          git clone --depth 1 --branch v25.12.1 https://git.openwrt.org/openwrt/openwrt.git openwrt-source
          cd openwrt-source
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi_r4=y
          EOF
          make defconfig

      - name: 3. Подготовка ядра и внедрение патча (4 уровня, 50-65°C)
        run: |
          cd openwrt-source
          make target/linux/prepare -j$(nproc)
          
          # Ищем DTS и патчим
          DTS_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" -print -quit)
          echo "Патчим файл: $DTS_FILE"
          
          cat << 'EOF' >> "$DTS_FILE"
          // === BPI-R4 THERMAL MOD START ===
          &pio {
                  pwm6_pins: pwm6-pins {
                          mux { function = "pwm"; groups = "pwm6_0"; };
                  };
          };

          &pwm {
                  pinctrl-names = "default";
                  pinctrl-0 = <&pwm6_pins>;
                  status = "okay";
          };

          / {
                  sfp_fan: sfp-fan {
                          compatible = "pwm-fan";
                          pwms = <&pwm 6 50000>;
                          cooling-levels = <0 75 125 180 255>;
                          #cooling-cells = <2>;
                  };
          };

          &{/thermal-zones} {
                  wifi-sfp-thermal {
                          polling-delay-passive = <1000>;
                          polling-delay = <5000>;
                          thermal-sensors = <&lvts 2>;

                          trips {
                                  sfp_t0: sfp-t0 { temperature = <50000>; hysteresis = <2000>; type = "active"; };
                                  sfp_t1: sfp-t1 { temperature = <55000>; hysteresis = <2000>; type = "active"; };
                                  sfp_t2: sfp-t2 { temperature = <60000>; hysteresis = <2000>; type = "active"; };
                                  sfp_t3: sfp-t3 { temperature = <65000>; hysteresis = <2000>; type = "active"; };
                          };

                          cooling-maps {
                                  map0 { trip = <&sfp_t0>; cooling-device = <&sfp_fan 1 1>; };
                                  map1 { trip = <&sfp_t1>; cooling-device = <&sfp_fan 2 2>; };
                                  map2 { trip = <&sfp_t2>; cooling-device = <&sfp_fan 3 3>; };
                                  map3 { trip = <&sfp_t3>; cooling-device = <&sfp_fan 4 4>; };
                          };
                  };
          };
          // === BPI-R4 THERMAL MOD END ===
          EOF

      - name: 4. Компиляция Золотого DTB
        run: |
          cd openwrt-source
          # Сервер GitHub соберет всё сам. У бесплатных серверов 2 ядра, так что это займет время.
          make -j$(nproc)

      - name: 5. Скачивание Image Builder и копирование DTB
        run: |
          wget https://downloads.openwrt.org/releases/25.12.1/targets/mediatek/filogic/openwrt-imagebuilder-25.12.1-mediatek-filogic.Linux-x86_64.tar.zst
          tar --zstd -xf openwrt-imagebuilder-25.12.1-mediatek-filogic.Linux-x86_64.tar.zst
          
          # Находим наш скомпилированный DTB из шага 4
          GOLDEN_DTB=$(realpath $(find openwrt-source/build_dir/target-*/linux-mediatek_filogic/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" -print -quit))
          echo "Найден скомпилированный DTB: $GOLDEN_DTB"
          
          # Закидываем в Image Builder
          TARGET_DIR="openwrt-imagebuilder-25.12.1-mediatek-filogic.Linux-x86_64/build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic"
          mkdir -p "$TARGET_DIR"
          cp "$GOLDEN_DTB" "$TARGET_DIR/image-mt7988a-bananapi-bpi-r4.dtb"

      - name: 6. Сборка финального образа
        run: |
          cd openwrt-imagebuilder-25.12.1-mediatek-filogic.Linux-x86_64
          make image PROFILE="bananapi_bpi-r4" PACKAGES="apk-mbedtls base-files ca-bundle dnsmasq dropbear firewall4 fitblk fstools kmod-crypto-hw-safexcel kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload libc libgcc libustream-mbedtls logd mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uboot-envtools uci uclient-fetch urandom-seed urngd wpad-basic-mbedtls kmod-hwmon-pwmfan kmod-i2c-mux-pca954x kmod-eeprom-at24 kmod-mt7996-firmware kmod-mt7996-233-firmware kmod-rtc-pcf8563 kmod-sfp kmod-usb3 e2fsprogs f2fsck mkf2fs mt7988-wo-firmware luci"

      - name: 7. Публикация прошивки
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-Thermal-Mod-25.12.1
          path: openwrt-imagebuilder-25.12.1-mediatek-filogic.Linux-x86_64/bin/targets/mediatek/filogic/*sysupgrade.itb
          retention-days: 14