name: BPi-R4 Source Build (Fixed Dependencies)

on:
  workflow_dispatch:

env:
  RELEASE: 25.12.0-rc4

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies (The Fix)
      run: |
        sudo apt update
        # ДОБАВЛЕНЫ: libmicrohttpd-dev, libarchive-dev, libsqlite3-dev, libcurl4-openssl-dev
        # Без них падает сборка tools/elfutils
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd \
        libelf-dev autopoint pkg-config autoconf automake \
        libarchive-dev libcurl4-openssl-dev libsqlite3-dev libmicrohttpd-dev

    - name: Clone OpenWrt Source
      run: git clone --depth 1 --branch v${{ env.RELEASE }} https://github.com/openwrt/openwrt.git openwrt

    - name: Update Feeds (Selective)
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        
        # ВМЕСТО install -a (который ломает сборку из-за кривых пакетов типа mutt/asterisk)
        # Мы ставим только то, что ты просил в своем конфиге.
        ./scripts/feeds install kmod-hwmon-pwmfan
        ./scripts/feeds install luci-ssl-nginx
        ./scripts/feeds install kmod-nvme
        ./scripts/feeds install ethtool
        # Остальные системные зависимости подтянутся сами.

    - name: Configure Target
      working-directory: ./openwrt
      run: |
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        
        # Твои пакеты
        CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
        CONFIG_PACKAGE_luci-ssl-nginx=y
        CONFIG_PACKAGE_kmod-nvme=y
        CONFIG_PACKAGE_ethtool=y
        EOF
        
        make defconfig

    - name: 🔥 APPLY FAN PATCH
      working-directory: ./openwrt
      run: |
        DTS_FILE="target/linux/mediatek/dts/mt7988a-bananapi-bpi-r4.dts"
        echo "Patching $DTS_FILE ..."
        
        cat << 'EOF' >> "$DTS_FILE"

        /* --- USER FAN PATCH --- */
        &pwm { status = "okay"; };
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        # Полная сборка, как ты хотел изначально
        # make download опционален, make сам скачает что надо
        make -j$(nproc) || make -j1 V=s

    - name: Organize Artifacts
      run: |
        mkdir -p output
        find openwrt/bin/targets/mediatek/filogic/ -name "*sysupgrade.itb" -exec cp {} output/ \;
        find openwrt/bin/targets/mediatek/filogic/ -name "*sdcard.img.gz" -exec cp {} output/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Fan-Build
        path: output/*