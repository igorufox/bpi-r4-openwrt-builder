name: Build OpenWrt BPi-R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (25.12-rc3)
        run: |
          git clone --depth 1 -b v25.12.0-rc3 https://github.com/openwrt/openwrt.git openwrt

      - name: Cache Toolchain & DL
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ${{ runner.os }}-openwrt-v25-12

      - name: Update Feeds
        run: |
          cd openwrt
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Hack Source (PWM6 & SFP ODI)
        run: |
          cd openwrt
          
          # 1. Активируем Пин 7 (PWM6) для вентилятора
          # Ищем DTS файл и дописываем настройки в конец (метод override)
          DTS_FILE=$(find target/linux/mediatek -name "mt7988a-bananapi-bpi-r4.dts")
          if [ -f "$DTS_FILE" ]; then
            echo -e "\n&pio { pwm6_pins: pwm6-pins { mux { function = \"pwm\"; groups = \"pwm6\"; }; }; };" >> $DTS_FILE
            echo -e "&pwm { pinctrl-0 = <&pwm0_pins>, <&pwm6_pins>; status = \"okay\"; };" >> $DTS_FILE
            echo "DTS Patched: $DTS_FILE"
          fi

          # 2. Лечим SFP ODI 2.5G
          # Поскольку исходники ядра еще не скачаны, мы создаем патч-инъекцию прямо в дерево таргета
          # Это гарантирует, что OpenWrt сам применит это при сборке ядра
          mkdir -p target/linux/mediatek/patches-6.12
          cat << 'EOF' > target/linux/mediatek/patches-6.12/999-sfp-odi-quirk.patch
--- a/drivers/net/phy/sfp-quirks.c
+++ b/drivers/net/phy/sfp-quirks.c
@@ -401,6 +401,7 @@ static const struct sfp_quirk sfp_quirks[] = {
 	SFP_QUIRK_F("HUAWEI", "MA5671A", sfp_quirk_2500base_x),
 	SFP_QUIRK_F("ODI", "DFP-34X-2C2", sfp_quirk_2500base_x),
+	SFP_QUIRK_F("ODI", "DFP-34X-2C3", sfp_quirk_2500base_x),
 	SFP_QUIRK_M("SFP-GE-T", sfp_quirk_1000base_t),
EOF
          echo "SFP Quirk Staged."

      - name: Generate Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          make defconfig

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-Custom-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.itb