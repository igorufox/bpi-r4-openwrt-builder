name: Build OpenWrt BPi-R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt (25.12-rc3)
        run: |
          git clone --depth 1 -b v25.12.0-rc3 https://github.com/openwrt/openwrt.git openwrt

      - name: Cache Toolchain & DL
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: ${{ runner.os }}-openwrt-v25-12

      - name: Update Feeds
        run: |
          cd openwrt
          # Лечим зеркала и выкидываем video
          sed -i 's|https://git.openwrt.org/feed/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/|https://github.com/openwrt/|g' feeds.conf.default
          sed -i '/video/d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-acme=y" >> .config
          echo "CONFIG_PACKAGE_nginx-ssl=y" >> .config
          make defconfig

      - name: Unpack Kernel and Patch (The Reliable Way)
        run: |
          cd openwrt
          
          # 1. Сначала правим DTS (он всегда на месте, так как лежит в репозитории OpenWrt)
          DTS="target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts"
          if [ -f "$DTS" ]; then
            echo "Patching DTS at $DTS..."
            echo -e "\n&pio {\n\tpwm6_pins: pwm6-pins {\n\t\tmux {\n\t\t\tfunction = \"pwm\";\n\t\t\tgroups = \"pwm6\";\n\t\t};\n\t};\n};\n\n&pwm {\n\tpinctrl-0 = <&pwm0_pins>, <&pwm6_pins>;\n\tstatus = \"okay\";\n};" >> "$DTS"
          else
            echo "FATAL: DTS file not found!"
            exit 1
          fi

          # 2. ПРИНУДИТЕЛЬНО распаковываем ядро, чтобы файлы физически появились
          echo "Unpacking kernel sources... (Wait ~2-3 mins)"
          make target/linux/prepare V=s
          
          # 3. Ищем sfp-quirks.c в папке build_dir (где бы он ни был)
          echo "Searching for unpacked kernel..."
          SFP_FILE=$(find build_dir -name sfp-quirks.c | grep "drivers/net/phy" | head -n 1)
          
          if [ -z "$SFP_FILE" ]; then
             echo "FATAL: Could not find sfp-quirks.c anywhere in build_dir!"
             exit 1
          fi
          
          echo "Found SFP file at: $SFP_FILE"
          
          # 4. Вживляем ODI патч через sed
          # Ищем строку с HUAWEI MA5671A и добавляем твой ODI сразу после неё
          sed -i '/"MA5671A"/a \	SFP_QUIRK_F("ODI", "DFP-34X-2C3", sfp_quirk_2500base_x),' "$SFP_FILE"
          
          # Проверка (выведет строки в лог, чтобы мы убедились)
          grep -C 2 "DFP-34X-2C3" "$SFP_FILE" || echo "WARNING: Grep check failed"

      - name: Build Firmware
        run: |
          cd openwrt
          # Игнорируем ошибки сборки пакетов, если они не критичны (-k)
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-Custom-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*.itb