name: Build OpenWrt BPi-R4 (Tag v25.12.0-rc4)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Clone OpenWrt Source (Tag v25.12.0-rc4)
      run: |
        # Клонируем КОНКРЕТНЫЙ ТЕГ. Если такого тега нет, git упадет с ошибкой.
        # Используем --depth 1 для скорости.
        git clone --depth 1 --branch v25.12.0-rc4 https://github.com/openwrt/openwrt.git openwrt
        
        cd openwrt
        
        # На всякий случай вырезаем video фид, который часто ломается, если он есть
        if grep -q "src-git video" feeds.conf.default; then
          sed -i '/src-git video/d' feeds.conf.default
        fi
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Target (BPi-R4)
      working-directory: ./openwrt
      run: |
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-fan=y" >> .config
        make defconfig

    - name: Create SFP Fan Patch (Auto-detect Kernel)
      working-directory: ./openwrt
      run: |
        # АВТОМАТИКА: Ищем папку с патчами для текущего ядра (6.6 или 6.12 или др)
        # Находим первую попавшуюся папку patches-6.* внутри target/linux/mediatek/
        PATCH_DIR=$(find target/linux/mediatek -maxdepth 1 -type d -name "patches-6.*" | sort -r | head -n 1)
        
        if [ -z "$PATCH_DIR" ]; then
            echo "CRITICAL ERROR: Could not find kernel patch directory!"
            exit 1
        fi
        
        echo "Detected Kernel Patch Directory: $PATCH_DIR"
        
        # Создаем патч в найденной папке
        cat << 'EOF' > "$PATCH_DIR/999-bpi-r4-sfp-fan.patch"
        --- a/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts
        +++ b/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4.dts
        @@ -74,4 +74,23 @@
         	managed = "in-band-status";
         	phy-mode = "usxgmii";
         	openwrt,netdev-name = "sfp-lan";
         	status = "okay";
         };
        +
        +&pio {
        +	pwm6_pins: pwm6-pins {
        +		mux {
        +			function = "pwm";
        +			groups = "pwm6_0";
        +		};
        +	};
        +};
        +
        +/ {
        +	sfp_fan: sfp-fan {
        +		compatible = "pwm-fan";
        +		pwms = <&pwm 6 50000>;
        +		pinctrl-names = "default";
        +		pinctrl-0 = <&pwm6_pins>;
        +		cooling-levels = <0 100 255>;
        +		#cooling-cells = <2>;
        +	};
        +};
        EOF
        
        echo "Patch created successfully."

    - name: Download Sources
      working-directory: ./openwrt
      run: make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Firmware-v25.12.0-rc4
        path: |
          openwrt/bin/targets/mediatek/filogic/*sdcard.img.gz
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb