name: Sniper Build (Selective Feeds)

on:
  workflow_dispatch:

env:
  RELEASE: 25.12.0-rc4
  PROFILE: bananapi_bpi-r4

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        # Важно: libelf-dev, autoconf, automake нужны для сборки инструментов (elfutils)
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd \
        libelf-dev autopoint pkg-config autoconf automake libsqlite3-dev libarchive-dev

    - name: Clone OpenWrt Source
      run: git clone --depth 1 --branch v${{ env.RELEASE }} https://github.com/openwrt/openwrt.git openwrt

    - name: Update & Install Selective Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        
        # --- ГЛАВНОЕ ИСПРАВЛЕНИЕ ---
        # Мы НЕ делаем install -a. Мы ставим точечно только то, что нужно.
        # Это позволяет избежать ошибок "recursive dependency" в пакетах типа curl/asterisk,
        # которые нам вообще не нужны для сборки ядра.
        ./scripts/feeds install kmod-hwmon-pwmfan
        ./scripts/feeds install kmod-nvme
        ./scripts/feeds install luci-ssl-nginx
        ./scripts/feeds install ethtool
        # Базовые системные пакеты подтянутся сами как зависимости.

    - name: Configure Target
      working-directory: ./openwrt
      run: |
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        # Включаем нужные модули в ядре сразу
        CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
        CONFIG_PACKAGE_kmod-nvme=y
        EOF
        make defconfig

    - name: 🔥 APPLY FAN PATCH
      working-directory: ./openwrt
      run: |
        DTS_FILE="target/linux/mediatek/dts/mt7988a-bananapi-bpi-r4.dts"
        echo "Patching $DTS_FILE ..."
        cat << 'EOF' >> $DTS_FILE
        /* --- USER FAN PATCH --- */
        &pwm { status = "okay"; };
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Build Toolchain & Kernel
      working-directory: ./openwrt
      run: |
        # 1. Собираем инструменты (благодаря libelf-dev ошибки elfutils не будет)
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        
        # 2. Собираем компилятор
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
        
        # 3. Собираем ядро и DTB
        make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

    - name: Extract DTB
      working-directory: ./openwrt
      run: |
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        if [ -z "$DTB" ]; then echo "❌ DTB missing"; exit 1; fi
        cp "$DTB" ../golden_patched.dtb
        echo "✅ DTB Extracted"

    # === IMAGE BUILDER ===
    - name: Download ImageBuilder
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.RELEASE }}/targets/mediatek/filogic"
        wget -q "$BASE_URL/sha256sums" -O sha256sums
        IB_FILE=$(grep -o "openwrt-imagebuilder-.*\.tar\.zst" sha256sums | head -n 1)
        wget "$BASE_URL/$IB_FILE" -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Build Firmware
      working-directory: ./imagebuilder
      run: |
        # Прогрев
        make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true
        
        # Подмена DTB
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        if [ -z "$TARGET_DTB" ]; then
           make target/linux/prepare || true
           TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi
        cp ../golden_patched.dtb "$TARGET_DTB"
        
        # Сборка
        make image PROFILE="${{ env.PROFILE }}" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Silent-Firmware
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz