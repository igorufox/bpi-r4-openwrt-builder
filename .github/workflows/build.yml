name: Fast Combo Build (SDK + ImageBuilder)

on:
  workflow_dispatch:

env:
  # Версия OpenWrt
  RELEASE: 25.12.0-rc4
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: bananapi_bpi-r4
  # Ссылки
  SDK_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic/openwrt-sdk-25.12.0-rc4-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  IB_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic/openwrt-imagebuilder-25.12.0-rc4-mediatek-filogic.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    # --- ЭТАП 1: ПОЛУЧЕНИЕ ЗОЛОТОГО DTB ЧЕРЕЗ SDK ---
    - name: Download & Setup SDK
      run: |
        wget ${{ env.SDK_URL }} -O sdk.tar.zst
        tar --zstd -xvf sdk.tar.zst
        mv openwrt-sdk-* sdk

    - name: Prepare SDK
      working-directory: ./sdk
      run: |
        # Обновляем фиды (нужно для сборки ядра)
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Настраиваем конфиг под R4
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        EOF
        make defconfig

    - name: Unpack Kernel Source
      working-directory: ./sdk
      run: |
        # Эта команда скачает исходники ядра и распакует их в build_dir
        # Компилировать пока рано, нам нужно только распаковать, чтобы пропатчить
        make target/linux/prepare

    - name: 🔥 APPLY FAN PATCH (To Source)
      working-directory: ./sdk
      run: |
        # Ищем, куда SDK распаковал DTS файл
        DTS_FILE=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" | head -n 1)
        
        echo "Patcher: Found DTS at $DTS_FILE"
        
        # Вживляем наш код. Так как это ИСХОДНИК, тут работают метки &pwm и &pio!
        cat << 'EOF' >> "$DTS_FILE"

        /* --- USER FAN PATCH (FROM SOURCE) --- */
        &pwm {
            status = "okay";
        };

        &pio {
            pwm6_pins: pwm6-pins {
                mux {
                    function = "pwm";
                    groups = "pwm6_0";
                };
            };
        };

        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF
        echo "✅ DTS Patched Successfully!"

    - name: Compile DTB
      working-directory: ./sdk
      run: |
        # Теперь собираем ядро. SDK использует свой встроенный gcc, поэтому ошибок не будет.
        # -j$(nproc) ускорит процесс
        make target/linux/compile -j$(nproc)

    - name: Extract Golden DTB
      working-directory: ./sdk
      run: |
        # Забираем свежий скомпилированный бинарник
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        cp "$DTB" ../golden_patched.dtb
        echo "✅ Extracted: ../golden_patched.dtb"

    # --- ЭТАП 2: СБОРКА ПРОШИВКИ ЧЕРЕЗ IMAGEBUILDER ---
    - name: Setup ImageBuilder
      run: |
        wget ${{ env.IB_URL }} -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Prepare ImageBuilder
      working-directory: ./imagebuilder
      run: |
        # Холостой прогон для создания папок
        make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true

    - name: 💉 INJECT GOLDEN DTB
      working-directory: ./imagebuilder
      run: |
        # Ищем стоковый файл в ImageBuilder
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        
        if [ -z "$TARGET_DTB" ]; then
           # Если папки еще нет, пнем его
           make target/linux/prepare || true
           TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi

        echo "🔄 Replacing stock DTB: $TARGET_DTB"
        cp ../golden_patched.dtb "$TARGET_DTB"

    - name: Build Final Firmware
      working-directory: ./imagebuilder
      run: |
        make image PROFILE="${{ env.PROFILE }}" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Silent-Firmware
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz