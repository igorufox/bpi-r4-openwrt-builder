name: Build OpenWrt BPi-R4 (Final Fix - Huawei Anchor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Clone OpenWrt Source (Tag v25.12.0-rc4)
      run: |
        git clone --depth 1 --branch v25.12.0-rc4 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        
        # Clean feeds
        sed -i '/src-git video/d' feeds.conf.default
        sed -i '/src-git telephony/d' feeds.conf.default
        
        ./scripts/feeds update -a || true
        ./scripts/feeds install -a || true

    - name: Configure Target (BPi-R4)
      working-directory: ./openwrt
      run: |
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-fan=y" >> .config
        echo "CONFIG_PACKAGE_ethtool-full=y" >> .config 
        make defconfig

    - name: Inject ODI Support (Huawei Anchor)
      working-directory: ./openwrt
      run: |
        make target/linux/prepare V=s
        
        SFP_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/drivers/net/phy/ -name "sfp.c" -print -quit)
        if [ -z "$SFP_FILE" ]; then echo "ERROR: sfp.c missing"; exit 1; fi
        
        echo "Target file: $SFP_FILE"
        
        # 1. Сначала покажем, как выглядит место, куда мы хотим вклиниться (для отладки)
        echo "--- Content BEFORE ---"
        grep -C 2 "MA5671A" "$SFP_FILE" || echo "WARNING: Anchor string not found!"
        
        # 2. Вставка. Ищем строку с HUAWEI и заменяем её на "Наши строки + Перенос + Строка с HUAWEI"
        # Используем & чтобы вернуть найденную строку на место (но уже после наших).
        # Экранируем кавычки.
        
        sed -i 's/SFP_QUIRK("HUAWEI", "MA5671A"/SFP_QUIRK("ODI", "DFP-34X-2C2", sfp_quirk_2500basex, sfp_fixup_ignore_tx_fault),\n\tSFP_QUIRK("ODI", "DFP-34X-2C3", sfp_quirk_2500basex, sfp_fixup_ignore_tx_fault),\n\t&/' "$SFP_FILE"
        
        # 3. Проверка
        echo "--- Content AFTER ---"
        grep -C 3 "ODI" "$SFP_FILE"

    - name: Apply Fan DTS (5 Steps)
      working-directory: ./openwrt
      run: |
        DTS_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" -print -quit)
        if [ -z "$DTS_FILE" ]; then echo "ERROR: DTS not found!"; exit 1; fi
        
        cat << 'EOF' >> "$DTS_FILE"
        
        /* --- SFP FAN DEFINITION --- */
        &pio {
            pwm6_pins: pwm6-pins {
                mux {
                    function = "pwm";
                    groups = "pwm6_0";
                };
            };
        };

        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Create Fan Control Script
      working-directory: ./openwrt
      run: |
        mkdir -p package/base-files/files/etc/init.d/
        cat << 'EOF' > package/base-files/files/etc/init.d/fan_control
        #!/bin/sh /etc/rc.common
        START=99
        USE_PROCD=1
        
        start_service() {
            procd_open_instance
            procd_set_param command /bin/sh -c '
                FAN_DEV="/sys/class/thermal/cooling_device1/cur_state"
                if [ "$(cat /sys/class/thermal/cooling_device1/max_state)" != "4" ]; then
                    for d in /sys/class/thermal/cooling_device*; do
                        if [ "$(cat $d/max_state)" = "4" ]; then FAN_DEV="$d/cur_state"; break; fi
                    done
                fi

                while true; do
                    MAX_TEMP=0
                    for hw in /sys/class/hwmon/hwmon*; do
                        NAME=$(cat "$hw/name" 2>/dev/null)
                        if echo "$NAME" | grep -q "mt7996"; then
                            for t in "$hw"/temp*_input; do
                                [ -f "$t" ] || continue
                                TEMP=$(cat "$t"); TEMP=$((TEMP / 1000))
                                if [ "$TEMP" -gt "$MAX_TEMP" ]; then MAX_TEMP=$TEMP; fi
                            done
                        fi
                    done
                    
                    if [ "$MAX_TEMP" -eq 0 ]; then
                        CPU_T=$(cat /sys/class/thermal/thermal_zone0/temp)