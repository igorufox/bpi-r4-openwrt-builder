name: Build OpenWrt BPi-R4 (Final Fix)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Clone OpenWrt Source
      run: |
        # Используем GitHub-зеркало.
        # --depth 1 для скорости и стабильности.
        git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
        
        cd openwrt
        
        # Удаляем проблемный фид video
        sed -i '/src-git video/d' feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Target (BPi-R4)
      working-directory: ./openwrt
      run: |
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-fan=y" >> .config
        make defconfig

    - name: Apply SFP Fan Mod (Direct Write)
      working-directory: ./openwrt
      run: |
        # 1. Распаковываем ядро
        make target/linux/prepare V=s
        
        # 2. Ищем файл DTS
        DTS_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" -print -quit)
        
        if [ -z "$DTS_FILE" ]; then
          echo "ERROR: DTS file not found!"
          exit 1
        fi
        
        echo "Modifying file: $DTS_FILE"
        
        # 3. Дописываем блок в конец файла
        cat << 'EOF' >> "$DTS_FILE"

        /* --- SFP FAN MOD START --- */

        &pio {
            pwm6_pins: pwm6-pins {
                mux {
                    function = "pwm";
                    groups = "pwm6_0";
                };
            };
        };

        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 100 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Download Sources
      working-directory: ./openwrt
      run: make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        # Убраны все echo, чтобы не ломать YAML кавычками
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Firmware
        path: |
          openwrt/bin/targets/mediatek/filogic/*sdcard.img.gz
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb