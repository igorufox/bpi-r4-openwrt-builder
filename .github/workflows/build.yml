name: Build BPI-R4 (v25.12.0-rc4 + DEVMEM)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  # Тот самый тэг, о котором ты говорил
  REPO_TAG: v25.12.0-rc4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source (Tag v25.12.0-rc4)
      run: |
        git clone $REPO_URL -b $REPO_TAG openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure (Enable DEVMEM & PWM)
      run: |
        cd openwrt
        # Настройка под BPI-R4
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        
        # !!! ГЛАВНОЕ: Открываем доступ к регистрам !!!
        echo "CONFIG_KERNEL_DEVMEM=y" >> .config
        echo "CONFIG_STRICT_DEVMEM=n" >> .config
        echo "CONFIG_IO_STRICT_DEVMEM=n" >> .config
        
        # Инструменты и модули
        echo "CONFIG_PACKAGE_io=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-mediatek-mt7988=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pwm-fan=y" >> .config
        
        # Применяем конфиг
        make defconfig

    - name: Download Packages
      run: |
        cd openwrt
        make download -j8

    - name: Compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: BPI-R4-25.12-RC4-DEVMEM
        path: openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb