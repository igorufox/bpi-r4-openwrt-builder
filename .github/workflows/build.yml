name: Reliable Hybrid Build (Full Env + ImageBuilder)

on:
  workflow_dispatch:

env:
  RELEASE: 25.12.0-rc4
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: bananapi_bpi-r4
  IB_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic/openwrt-imagebuilder-25.12.0-rc4-mediatek-filogic.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        # Полный набор пакетов, чтобы ничего не отвалилось
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd \
        autopoint gperf texinfo help2man libtool libtool-bin pkg-config libelf-dev \
        autoconf automake libsqlite3-dev libarchive-dev

    # --- ЭТАП 1: СБОРКА DTB (СТАНДАРТНЫЙ МЕТОД) ---
    - name: Clone OpenWrt Source
      run: git clone --depth 1 --branch v${{ env.RELEASE }} https://github.com/openwrt/openwrt.git openwrt

    - name: Update & Install Feeds (THE FIX)
      working-directory: ./openwrt
      run: |
        # ВЕРНУЛ КАК БЫЛО: Полная установка фидов.
        # Это лечит ошибку elfutils и рекурсивных зависимостей.
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Target
      working-directory: ./openwrt
      run: |
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        EOF
        make defconfig

    - name: 🔥 APPLY FAN PATCH (Source Level)
      working-directory: ./openwrt
      run: |
        DTS_FILE="target/linux/mediatek/dts/mt7988a-bananapi-bpi-r4.dts"
        echo "Patching $DTS_FILE ..."
        
        cat << 'EOF' >> $DTS_FILE
        /* --- USER FAN PATCH (SOURCE) --- */
        &pwm { status = "okay"; };
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Compile Device Tree (DTB)
      working-directory: ./openwrt
      run: |
        # Собираем target/linux. Система сама соберет тулчейн как надо.
        # Это дольше, но надежнее.
        make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

    - name: Extract Golden DTB
      working-directory: ./openwrt
      run: |
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        if [ -z "$DTB" ]; then
           echo "❌ ERROR: DTB not built!"
           exit 1
        fi
        cp "$DTB" ../golden_patched.dtb
        echo "✅ SUCCESS: Extracted $DTB"

    # --- ЭТАП 2: СБОРКА ПРОШИВКИ (IMAGEBUILDER) ---
    - name: Setup ImageBuilder
      run: |
        wget ${{ env.IB_URL }} -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Prepare ImageBuilder
      working-directory: ./imagebuilder
      run: make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true

    - name: 💉 INJECT GOLDEN DTB
      working-directory: ./imagebuilder
      run: |
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        if [ -z "$TARGET_DTB" ]; then
           make target/linux/prepare || true
           TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi
        echo "🔄 Replacing: $TARGET_DTB"
        cp ../golden_patched.dtb "$TARGET_DTB"

    - name: Build Final Firmware
      working-directory: ./imagebuilder
      run: |
        make image PROFILE="${{ env.PROFILE }}" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Silent-Firmware
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz