name: SDK Build (No Feeds - Pure Kernel)

on:
  workflow_dispatch:

env:
  RELEASE: 25.12.0-rc4
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: bananapi_bpi-r4
  BASE_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    # === 1. СКАЧИВАЕМ SDK ===
    - name: Download SDK
      run: |
        wget -q "${{ env.BASE_URL }}/sha256sums" -O sha256sums
        SDK_FILE=$(grep -o "openwrt-sdk-.*\.tar\.zst" sha256sums | head -n 1)
        wget "${{ env.BASE_URL }}/$SDK_FILE" -O sdk.tar.zst
        tar --zstd -xvf sdk.tar.zst
        mv openwrt-sdk-* sdk

    # === 2. ПОДГОТОВКА (БЕЗ ФИДОВ) ===
    - name: Prepare Kernel Source
      working-directory: ./sdk
      run: |
        # ВАЖНО: Удаляем источники пакетов. Нам нужен ТОЛЬКО компилятор и ядро.
        # Это лечит ошибку "recursive dependency" в Nginx.
        echo '' > feeds.conf.default
        
        # Создаем конфиг
        cat > .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y
        EOF
        make defconfig
        
        # Распаковываем ядро
        make target/linux/prepare

    # === 3. ПАТЧ ВЕНТИЛЯТОРА ===
    - name: 🔥 APPLY FAN PATCH
      working-directory: ./sdk
      run: |
        DTS_FILE=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" | head -n 1)
        
        if [ -z "$DTS_FILE" ]; then
           echo "❌ ERROR: DTS file not found!"
           exit 1
        fi

        echo "✅ Patching $DTS_FILE ..."
        
        cat << 'EOF' >> "$DTS_FILE"

        /* --- USER FAN PATCH --- */
        &pwm { status = "okay"; };
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000 0>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    # === 4. КОМПИЛЯЦИЯ DTB ===
    - name: Compile DTB
      working-directory: ./sdk
      run: |
        # Компилируем только ядро (DTS собирается вместе с ним)
        make target/linux/compile -j$(nproc)

    - name: Extract Golden DTB
      working-directory: ./sdk
      run: |
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        if [ -z "$DTB" ]; then
           echo "❌ ERROR: DTB binary not found!"
           exit 1
        fi
        cp "$DTB" ../golden_patched.dtb
        echo "✅ FOUND: ../golden_patched.dtb"

    # === 5. IMAGE BUILDER ===
    - name: Download ImageBuilder
      run: |
        IB_FILE=$(grep -o "openwrt-imagebuilder-.*\.tar\.zst" sha256sums | head -n 1)
        wget "${{ env.BASE_URL }}/$IB_FILE" -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Build Final Firmware
      working-directory: ./imagebuilder
      run: |
        # Прогрев (создание папок)
        make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true
        
        # Подмена DTB
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        if [ -z "$TARGET_DTB" ]; then
           make target/linux/prepare || true
           TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi
        
        echo "🔄 Replacing $TARGET_DTB"
        cp ../golden_patched.dtb "$TARGET_DTB"
        
        # Сборка
        make image PROFILE="${{ env.PROFILE }}" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Silent-Firmware
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz