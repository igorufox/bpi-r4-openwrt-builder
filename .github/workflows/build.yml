name: Build OpenWrt BPi-R4 (Working Source + IB)

on:
  workflow_dispatch:

env:
  RELEASE: 25.12.0-rc4
  PROFILE: bananapi_bpi-r4
  # Ссылка на ImageBuilder для финальной сборки
  IB_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/mediatek/filogic/openwrt-imagebuilder-25.12.0-rc4-mediatek-filogic.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget libelf-dev

    - name: Clone OpenWrt Source (Tag v25.12.0-rc4)
      run: |
        git clone --depth 1 --branch v25.12.0-rc4 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        
        # Твои фиксы фидов (как в рабочем конфиге)
        sed -i '/src-git video/d' feeds.conf.default
        sed -i '/src-git telephony/d' feeds.conf.default
        
        ./scripts/feeds update -a || true
        ./scripts/feeds install -a || true

    - name: Configure Target (BPi-R4)
      working-directory: ./openwrt
      run: |
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4=y" >> .config
        echo "CONFIG_PACKAGE_kmod-hwmon-pwmfan=y" >> .config
        make defconfig

    - name: Inject ODI Support (Safe Script Method)
      working-directory: ./openwrt
      run: |
        make target/linux/prepare V=s
        SFP_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/drivers/net/phy/ -name "sfp.c" -print -quit)
        if [ -z "$SFP_FILE" ]; then echo "ERROR: sfp.c missing"; exit 1; fi
        
        cat << 'EOF' > odi_patch.sed
        /SFP_QUIRK("HUAWEI", "MA5671A"/i \
        	SFP_QUIRK("ODI", "DFP-34X-2C2", sfp_quirk_2500basex, sfp_fixup_ignore_tx_fault),\
        	SFP_QUIRK("ODI", "DFP-34X-2C3", sfp_quirk_2500basex, sfp_fixup_ignore_tx_fault),
        EOF
        sed -i -f odi_patch.sed "$SFP_FILE"

    - name: Apply Fan DTS
      working-directory: ./openwrt
      run: |
        DTS_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dts" -print -quit)
        
        cat << 'EOF' >> "$DTS_FILE"
        /* --- SFP FAN DEFINITION --- */
        &pio {
            pwm6_pins: pwm6-pins {
                mux { function = "pwm"; groups = "pwm6_0"; };
            };
        };
        / {
            sfp_fan: sfp-fan {
                compatible = "pwm-fan";
                pwms = <&pwm 6 50000>;
                pinctrl-names = "default";
                pinctrl-0 = <&pwm6_pins>;
                cooling-levels = <0 75 125 180 255>;
                #cooling-cells = <2>;
            };
        };
        EOF

    - name: Download Sources
      working-directory: ./openwrt
      run: make download -j8

    - name: Compile Firmware (Source Build)
      working-directory: ./openwrt
      run: |
        # ВОЗВРАЩАЕМ КАК БЫЛО У ТЕБЯ. Полная сборка.
        # Это долго (1 час), но это гарантированно работает и создает правильный DTB.
        make -j$(nproc) || make -j1 V=s

    # === НАЧАЛО НОВОЙ ЛОГИКИ (IMAGE BUILDER) ===
    
    - name: Extract Golden DTB
      working-directory: ./openwrt
      run: |
        # Ищем файл .dtb, который только что скомпилировался
        DTB=$(find build_dir/target-*/linux-*/linux-*/arch/arm64/boot/dts/mediatek/ -name "mt7988a-bananapi-bpi-r4.dtb" | head -n 1)
        
        if [ -z "$DTB" ]; then
           echo "❌ ERROR: Patched DTB not found!"
           exit 1
        fi
        
        # Копируем его в безопасное место
        cp "$DTB" ../golden_patched.dtb
        echo "✅ Found and extracted: $DTB"

    - name: Setup ImageBuilder
      run: |
        # Скачиваем официальный ImageBuilder
        wget ${{ env.IB_URL }} -O ib.tar.zst
        tar --zstd -xvf ib.tar.zst
        mv openwrt-imagebuilder-* imagebuilder

    - name: Inject Patched DTB
      working-directory: ./imagebuilder
      run: |
        # Прогреваем, чтобы распаковались папки
        make image PROFILE="${{ env.PROFILE }}" PACKAGES="base-files" || true
        
        # Находим, где лежит стоковый DTB внутри ImageBuilder
        TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        
        if [ -z "$TARGET_DTB" ]; then
             # Если не нашел, пробуем подготовить ядро
             make target/linux/prepare || true
             TARGET_DTB=$(find build_dir -name "image-mt7988a-bananapi-bpi-r4.dtb" -print -quit)
        fi
        
        if [ -z "$TARGET_DTB" ]; then
             echo "❌ Critical Error: Could not find destination DTB in ImageBuilder"
             exit 1
        fi

        echo "🔄 Replacing stock DTB at: $TARGET_DTB"
        cp ../golden_patched.dtb "$TARGET_DTB"
        echo "✅ DTB Replaced successfully!"

    - name: Build Final Image (Official Kernel + Fan Patch)
      working-directory: ./imagebuilder
      run: |
        # Создаем скрипт управления вентилятором
        mkdir -p files/etc/init.d
        cat << 'EOF' > files/etc/init.d/fan_control
        #!/bin/sh /etc/rc.common
        START=99
        USE_PROCD=1
        start_service() {
            procd_open_instance
            procd_set_param command /bin/sh -c '
                FAN_DEV="/sys/class/thermal/cooling_device1/cur_state"
                if [ "$(cat /sys/class/thermal/cooling_device1/max_state)" != "4" ]; then
                    for d in /sys/class/thermal/cooling_device*; do
                        if [ "$(cat $d/max_state)" = "4" ]; then FAN_DEV="$d/cur_state"; break; fi
                    done
                fi
                while true; do
                    echo 1 > "$FAN_DEV"
                    sleep 10
                done
            '
            procd_set_param respawn
            procd_close_instance
        }
        EOF
        chmod +x files/etc/init.d/fan_control

        # Собираем прошивку с нужными пакетами
        make image PROFILE="${{ env.PROFILE }}" FILES="files" \
        PACKAGES="kmod-hwmon-pwmfan kmod-nvme kmod-fs-ext4 kmod-usb-storage kmod-usb-storage-uas block-mount e2fsprogs fdisk ethtool luci-ssl-nginx nano htop"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BPi-R4-Official-Kernel-Patched
        path: |
          imagebuilder/bin/targets/mediatek/filogic/*sysupgrade.itb
          imagebuilder/bin/targets/mediatek/filogic/*sdcard.img.gz